# Release automation for @betanyc/nyc-council-mcp.
#
# Publishes the package to npm and creates a GitHub Release whenever a version
# tag (v*) is pushed. This closes the release gap where fixes merged to main
# but never reached npm: the release step is now a tag push, not a manual
# `npm publish` someone has to remember to run. Part of the fleet-wide
# release-hygiene rollout across the six BetaNYC MCP repos. Owned by the
# software-engineer agent.
#
# Flow: bump the version in package.json via PR → merge → push the matching
# tag (e.g. v2.2.0) → this workflow tests, verifies tag == package.json
# version, runs the two release gates (WHATS-CHANGED.md dated and valid,
# DATA-SOURCES.json valid with a real contact; #76), publishes with npm
# provenance, and creates a GitHub Release with generated notes.
#
# Prerequisite: the NPM_TOKEN org secret (an npm automation token with publish
# rights on @betanyc) must be configured.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  # contents: write — create the GitHub Release.
  # id-token: write — mint the OIDC token npm provenance requires.
  contents: write
  id-token: write

jobs:
  release:
    name: Publish to npm & create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          # registry-url makes setup-node write an .npmrc that reads the
          # auth token from NODE_AUTH_TOKEN at publish time.
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      # server.json is the MCP Registry listing (see publish-mcp.yml). It must
      # be at the same version as package.json and carry its mcpName, or the
      # registry publish that follows this workflow will fail.
      - name: Verify server.json versions match package.json
        run: |
          node -e '
            const p = require("./package.json"), s = require("./server.json");
            const bad = [s.version, ...s.packages.map((x) => x.version)].filter((v) => v !== p.version);
            if (bad.length || s.name !== p.mcpName) { console.error("server.json is out of step with package.json"); process.exit(1); }
          '

      # Guard: the pushed tag must match the version in package.json exactly
      # (tag v2.2.0 ⇔ "version": "2.2.0"). Catches the classic mistake of
      # tagging before merging the version-bump PR, which would otherwise
      # publish the wrong version.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}."
            echo "Push a tag named v${PKG_VERSION}, or merge a version-bump PR first, then re-tag."
            exit 1
          fi

      # Release gates (#76), from the What's changed and about-data standards. Each stops the
      # release before anything is published:
      # - check --release fails while WHATS-CHANGED.md has an "Unreleased:" entry, or has any
      #   other error, so a release cannot ship undated or with a broken history;
      # - about-data check --release fails on any error in DATA-SOURCES.json, a tool without a
      #   source, or the placeholder contact address.
      # scripts/whats_changed.py is a copy of BetaNYC's shared file: never edit it here.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Release gate: WHATS-CHANGED.md is dated and valid"
        run: python3 scripts/whats_changed.py check WHATS-CHANGED.md --release

      - name: "Release gate: DATA-SOURCES.json is valid and names a real contact"
        run: |
          node --input-type=module -e '
          const l = await import("./dist/tools/local.js"), v = await import("./dist/tools/live.js");
          const b = await import("./dist/betanyc-tools.js");
          const names = [...l.LOCAL_TOOL_DEFS, ...v.LIVE_TOOL_DEFS, v.LIVE_SEARCH_TOOL_DEF].map((t) => t.name);
          console.log(JSON.stringify([...new Set([...names, ...b.BETANYC_TOOL_NAMES])]));
          ' > "$RUNNER_TEMP/tools.json"
          python3 scripts/whats_changed.py about-data check DATA-SOURCES.json --release --tools-file "$RUNNER_TEMP/tools.json"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
